name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint · Validate · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check every JS file
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'));console.log('manifest.json OK')"

      - name: Unit tests (policy engine)
        run: node --test

  package:
    name: Build unpacked zip
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the extension
        run: |
          zip -r "block-popup-${GITHUB_REF_NAME}.zip" \
            manifest.json src \
            -x '*.DS_Store'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-popup-${{ github.ref_name }}
          path: block-popup-*.zip

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: block-popup-*.zip
